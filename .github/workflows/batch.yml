name: Run Batch Prediction

on:
  workflow_dispatch:      # allows manual trigger from the Actions tab
  schedule:
    - cron: "*/5 * * * *"  # runs every 5 minutes (UTC time)

jobs:
  run-batch:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow numpy pillow pandas gdown

      # Run the batch prediction script
      - name: Run batch prediction
        run: python main.py

      # Commit new predictions to the repo
      - name: Commit and push predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/*.csv || true
          if git diff --cached --quiet; then
            echo "No new CSVs to commit."
          else
            git commit -m "🧠 Add predictions - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin main || true
            git push origin main || true
