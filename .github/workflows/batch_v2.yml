name: Run Batch Prediction

on:
  workflow_dispatch:  # اجرای دستی از GitHub
  schedule:
    - cron: '0 12 * * *'  # اجرای خودکار روزانه (UTC 12:00)

jobs:
  run-batch:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow numpy pillow requests pandas

      - name: 🚀 Run batch prediction
        run: |
          echo "Running batch prediction at $(date)"
          python main.py

      - name: 📤 Upload predictions CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily_predictions
          path: daily_predictions.csv
