name: Standard Batch Prediction

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Required permission to allow GitHub Actions to save files back to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Prediction
      run: |
        python main.py
        
    - name: Commit and Push Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add predictions/predictions.csv
        git commit -m "Auto-update predictions.csv with latest results" || echo "No new predictions to commit"
        git push